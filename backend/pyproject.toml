[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "querycraft"
version = "1.5.0"
description = "QueryCraft — Universal SQL & NoSQL Query, Clarification & Optimization Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.9",
    "pymongo>=4.6.3",
    "langchain-core>=0.2.0",
    "langgraph>=0.0.50",
    "langchain-nvidia-ai-endpoints>=0.1.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "openai>=1.30.0",
    "mcp>=2.1.1",
]

[project.scripts]
querycraft = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
