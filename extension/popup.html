<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueryCraft</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app" class="app-root">
    
    <!-- Ultra-Minimalist Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
          </svg>
        </div>
        
        <!-- Active DB Quick Switcher -->
        <button type="button" class="db-pill" id="dbSwitcherTrigger" title="Switch database (Cmd+K)">
          <span class="status-indicator live" id="activeDbDot"></span>
          <span class="db-label" id="activeDbName">Demo DB</span>
          <span class="tbl-count" id="activeDbBadge">5 tbls</span>
          <svg class="chevron-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4 6l4 4 4-4"/>
          </svg>
        </button>
      </div>

      <!-- Segmented Nav -->
      <nav class="nav-pills">
        <button type="button" class="nav-item active" data-tab="chat">Chat</button>
        <button type="button" class="nav-item" data-tab="schema">Schema</button>
        <button type="button" class="nav-item" data-tab="databases">DBs</button>
      </nav>

      <!-- Right Actions -->
      <div class="topbar-right">
        <button type="button" class="action-btn" id="btnResetChat" title="Clear conversation">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M2 2.5h12M5.5 2.5V1.5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v1M13 4.5l-.8 9.5a1.5 1.5 0 0 1-1.5 1.5H5.3a1.5 1.5 0 0 1-1.5-1.5L3 4.5"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- DB Profiles Popover -->
    <div class="popover hidden" id="dbDropdownMenu">
      <div class="popover-header">
        <span>Active Connections</span>
        <span class="popover-badge" id="dbCountBadge">1</span>
      </div>
      <div class="popover-list" id="dbProfilesList">
        <!-- Rendered dynamically -->
      </div>
      <button type="button" class="popover-action" id="btnAddDbQuick">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>
        <span>Add Connection</span>
      </button>
    </div>

    <!-- VIEW 1: Chat Stream -->
    <main class="view-panel active" id="tabChat">
      
      <!-- Minimalist Welcome State -->
      <div class="empty-state" id="welcomeState">
        <div class="empty-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <ellipse cx="12" cy="5" rx="9" ry="3"/>
            <path d="M3 5v14a9 3 0 0 0 18 0V5"/>
            <path d="M3 12a9 3 0 0 0 18 0"/>
          </svg>
        </div>
        <h2 class="empty-title">PostgreSQL Query Engine</h2>
        <p class="empty-desc">
          Grounded on <span id="welcomeDbName" class="font-medium text-white">Demo DB</span> schema. Ambiguous metrics and filters are clarified automatically.
        </p>

        <!-- Minimal Quick Starters -->
        <div class="quick-prompts">
          <div class="prompts-label">Quick Starters</div>
          <div class="prompts-list">
            <button type="button" class="prompt-chip" data-prompt="Show top 5 customers by total order spend in 2024">
              <span class="chip-badge">Ambiguous</span>
              <span class="chip-query">Top 5 customers by spend in 2024</span>
            </button>
            <button type="button" class="prompt-chip" data-prompt="Find completed orders from the last 7 days with customer names and total amount">
              <span class="chip-badge">Joins</span>
              <span class="chip-query">Completed orders in last 7 days</span>
            </button>
            <button type="button" class="prompt-chip" data-prompt="List available products with stock quantity below 20 ordered by price ASC">
              <span class="chip-badge">Filter</span>
              <span class="chip-query">Low stock products below 20</span>
            </button>
            <button type="button" class="prompt-chip" data-prompt="Calculate total revenue generated per payment method in 2024">
              <span class="chip-badge">Group By</span>
              <span class="chip-query">Revenue by payment method</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Messages Stream -->
      <div class="message-stream hidden" id="messagesFeed">
        <!-- Rendered dynamically -->
      </div>

      <!-- Live Query Results Drawer -->
      <div class="results-drawer hidden" id="queryResultsDrawer">
        <div class="results-bar">
          <div class="results-title">
            <span class="results-dot"></span>
            <span>Query Results</span>
            <span class="results-count" id="resultRowCount">0 rows</span>
          </div>
          <div class="results-actions">
            <button type="button" class="drawer-btn" id="btnExportCsv" title="Copy as CSV">CSV</button>
            <button type="button" class="drawer-btn close" id="btnCloseResults">✕</button>
          </div>
        </div>
        <div class="results-table-wrap" id="queryResultsContent">
          <!-- Table -->
        </div>
      </div>

    </main>

    <!-- VIEW 2: Schema Explorer -->
    <section class="view-panel hidden" id="tabSchema">
      <div class="search-box">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="7" cy="7" r="5"/>
          <path d="m11 11 3.5 3.5"/>
        </svg>
        <input type="text" id="inputSchemaSearch" placeholder="Filter tables or columns..." />
        <button type="button" class="text-btn" id="btnToggleAllTables">Expand All</button>
      </div>

      <div class="schema-list" id="schemaTablesContainer">
        <!-- Tables rendered dynamically -->
      </div>
    </section>

    <!-- VIEW 3: DB Connections Manager -->
    <section class="view-panel hidden" id="tabDatabases">
      
      <div class="panel-section">
        <div class="section-heading">
          <h3>Add Database Profile</h3>
        </div>

        <form id="formAddDb" class="clean-form">
          <div class="field-row">
            <label>Name</label>
            <input type="text" id="inputProfileName" required placeholder="e.g. Supabase Prod, Neon DB" />
          </div>

          <div class="field-row">
            <label>Provider Preset</label>
            <div class="presets-row">
              <button type="button" class="preset-btn" data-uri="postgresql://postgres:[PASSWORD]@db.[REF].supabase.co:5432/postgres">Supabase</button>
              <button type="button" class="preset-btn" data-uri="postgresql://[USER]:[PASSWORD]@ep-[ID].region.aws.neon.tech/neondb?sslmode=require">Neon</button>
              <button type="button" class="preset-btn" data-uri="postgresql://[USER]:[PASSWORD]@[ENDPOINT].rds.amazonaws.com:5432/[DBNAME]">RDS</button>
              <button type="button" class="preset-btn" data-uri="postgresql://postgres:postgres@localhost:5432/postgres">Local</button>
            </div>
          </div>

          <div class="field-row">
            <label>Connection String</label>
            <div class="uri-input-wrap">
              <input type="password" id="inputConnectionUri" required placeholder="postgresql://user:pass@host:5432/db" />
              <button type="button" class="eye-toggle" id="btnToggleUriEye">👁</button>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="btnConnectProfile">
            Connect &amp; Introspect
          </button>
        </form>
      </div>

      <div class="panel-section">
        <div class="section-heading">
          <h3>Saved Databases (<span id="savedCount">1</span>)</h3>
        </div>
        <div class="saved-dbs-list" id="savedProfilesList">
          <!-- Rendered dynamically -->
        </div>
      </div>

    </section>

    <!-- Minimal Floating Command / Input Bar (Chat Tab) -->
    <footer class="dock-footer" id="appFooter">
      <div class="command-bar">
        <textarea 
          id="userPromptInput" 
          rows="1" 
          placeholder="Ask a question or clarify query..."
        ></textarea>
        <button type="button" class="send-btn" id="btnSendPrompt" title="Send (Enter)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/>
          </svg>
        </button>
      </div>
      <div class="dock-meta">
        <span class="meta-status" id="serverStatusText">127.0.0.1:8000</span>
        <span class="meta-hint">Enter ↵ • Shift+Enter ↵ for line</span>
      </div>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
