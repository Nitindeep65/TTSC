<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#070b16"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Primary Emerald Gradient for Top Disk -->
    <linearGradient id="top-disk-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cylinder Side Wall Gradient -->
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Dark Layer Side Wall Gradient -->
    <linearGradient id="dark-wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- AI Sparkle Radiant Radial Glow -->
    <radialGradient id="sparkle-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="1"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="ambient-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>

    <filter id="ai-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#34d399" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="url(#border-glow)" stroke-width="10"/>

  <!-- Subtle Inner Ambient Mesh -->
  <circle cx="256" cy="256" r="160" fill="#10b981" opacity="0.06"/>

  <!-- Group: Database Layer Stack (with Ambient Shadow) -->
  <g filter="url(#ambient-shadow)">
    
    <!-- ── BOTTOM LAYER (Tier 3) ── -->
    <!-- Base Cylinder Wall -->
    <path d="M 128 320 L 128 360 C 128 395, 384 395, 384 360 L 384 320 Z" fill="url(#dark-wall-grad)"/>
    <!-- Bottom Rim Stroke -->
    <path d="M 128 360 C 128 395, 384 395, 384 360" fill="none" stroke="#34d399" stroke-width="4" opacity="0.7"/>

    <!-- ── MIDDLE LAYER (Tier 2) ── -->
    <!-- Middle Cylinder Wall -->
    <path d="M 128 240 L 128 280 C 128 315, 384 315, 384 280 L 384 240 Z" fill="url(#wall-grad)"/>
    <!-- Middle Rim Stroke -->
    <path d="M 128 280 C 128 315, 384 315, 384 280" fill="none" stroke="#6ee7b7" stroke-width="4" opacity="0.8"/>

    <!-- ── TOP LAYER (Tier 1) ── -->
    <!-- Top Cylinder Wall -->
    <path d="M 128 160 L 128 200 C 128 235, 384 235, 384 200 L 384 160 Z" fill="url(#wall-grad)"/>
    <!-- Top Rim Stroke -->
    <path d="M 128 200 C 128 235, 384 235, 384 200" fill="none" stroke="#6ee7b7" stroke-width="4" opacity="0.9"/>
    
    <!-- Top Disk Ellipse Cap -->
    <ellipse cx="256" cy="160" rx="128" ry="42" fill="url(#top-disk-grad)" stroke="#a7f3d0" stroke-width="5"/>

    <!-- Top Cap Inner Gloss Highlight -->
    <ellipse cx="256" cy="154" rx="108" ry="30" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
  </g>

  <!-- ── AI NEURAL NODES & QUERY ACCELERATOR SPARKS ── -->
  <!-- Connecting Neural Circuits on Database Wall -->
  <g opacity="0.85">
    <circle cx="176" cy="200" r="5" fill="#ffffff" filter="url(#ai-glow)"/>
    <circle cx="256" cy="280" r="5" fill="#ffffff" filter="url(#ai-glow)"/>
    <circle cx="336" cy="360" r="5" fill="#ffffff" filter="url(#ai-glow)"/>
  </g>

  <!-- Radiant AI Sparkle Star (Top Right of Database) -->
  <g transform="translate(372, 116)" filter="url(#ai-glow)">
    <!-- Ambient Radial Halo -->
    <circle cx="0" cy="0" r="44" fill="url(#sparkle-glow)"/>
    
    <!-- 4-Point AI Primary Star -->
    <path d="M 0 -36 Q 0 0 -36 0 Q 0 0 0 36 Q 0 0 36 0 Q 0 0 0 -36 Z" fill="#ffffff"/>
    
    <!-- Center Core Glow -->
    <circle cx="0" cy="0" r="7" fill="#6ee7b7"/>
  </g>

  <!-- Secondary Accent Sparkle (Lower Left) -->
  <g transform="translate(104, 380)" filter="url(#ai-glow)">
    <path d="M 0 -18 Q 0 0 -18 0 Q 0 0 0 18 Q 0 0 18 0 Q 0 0 0 -18 Z" fill="#34d399" opacity="0.9"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
  </g>
</svg>
